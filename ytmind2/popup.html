<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: 'Segoe UI', sans-serif; padding: 16px; margin: 0; }
    h2 { margin: 0 0 12px; font-size: 16px; color: #6366f1; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: #374151; }
    input, select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 6px; background: #6366f1; color: white; font-size: 14px; cursor: pointer; }
    button:hover { background: #4f46e5; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    #status { margin-top: 10px; font-size: 12px; text-align: center; min-height: 16px; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 4px; }
    a { color: #6366f1; }
  </style>
</head>
<body>
  <h2>🧠 YTMind 2.0</h2>

  <label>Groq API Key</label>
  <input type="password" id="apiKey" placeholder="gsk_...">
  <div class="hint">Get a free key at <a href="https://console.groq.com" target="_blank">console.groq.com</a></div>

  <div class="row">
    <div>
      <label>Answer length</label>
      <select id="length">
        <option value="short">Short</option>
        <option value="normal" selected>Normal</option>
        <option value="detailed">Detailed</option>
      </select>
    </div>
    <div>
      <label>Language</label>
      <select id="lang">
        <option value="auto" selected>Auto</option>
        <option value="english">English</option>
        <option value="urdu">Urdu</option>
        <option value="roman">Roman Urdu</option>
      </select>
    </div>
  </div>

  <label style="margin-top:12px;">
    <input type="checkbox" id="auto" style="width:auto;"> Auto-summarize new videos
  </label>

  <button id="save">Save & Open YTMind</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
